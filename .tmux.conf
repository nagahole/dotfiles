set -g status-position bottom

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Nybkox/tmux-ukiyo'

# Set Ukiyo theme explicitly to Kanagawa Dragon/Ink variant
set -g @ukiyo-theme "kanagawa/dragon"

# Enable window tab-like views
set -g @ukiyo-window-tabs-enabled on

# Initialize TMUX plugin manager (Must be the last line!)
run '~/.tmux/plugins/tpm/tpm'

